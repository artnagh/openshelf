name: Trending bot + build + deploy
on:
  push:
    branches: [main]
  schedule:
    - cron: "0 5 * * *"   # every day 05:00 UTC
  workflow_dispatch:
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    env:
      R2_BUCKET: ${{ secrets.R2_BUCKET }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Trending bot (find new repos + pull their skills)
        if: github.event_name != 'push'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 scripts/trending.py --components
      - name: Save bot data back to the repo
        if: github.event_name != 'push'
        run: |
          git config user.name "openshelf-bot"
          git config user.email "openshelf-bot@users.noreply.github.com"
          git add data/
          git diff --cached --quiet || git commit -m "bot: daily trending update $(date -u +%F)"
          git push
      - name: Archive trending repos to Cloudflare R2 (only if secrets are set)
        if: github.event_name != 'push' && env.R2_BUCKET != ''
        env:
          R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
        run: bash scripts/archive_to_r2.sh
      - run: python3 scripts/build.py && python3 scripts/readme.py
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
